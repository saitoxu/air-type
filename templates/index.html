<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>air-type</title>
    <style>
        html, body { height: 100%; margin: 0; overscroll-behavior: none; }
        body { font-family: -apple-system, sans-serif; display: flex; flex-direction: column;
               padding: 0; box-sizing: border-box; gap: 4px;
               padding-bottom: env(safe-area-inset-bottom); }
        #preview-wrap { flex: 1; min-height: 120px; overflow: auto;
                        background: #000; -webkit-overflow-scrolling: touch; }
        #preview { display: block; width: 100%; max-width: none; }
        #preview.click-mode { cursor: crosshair; }
        .badge { position: fixed; padding: 4px 10px; background: rgba(0,0,0,0.55);
                 color: #fff; font-size: 12px; border-radius: 12px;
                 pointer-events: none; z-index: 100; }
        #zoom-indicator { top: 8px; right: 8px; }
        #status { top: 8px; left: 8px; max-width: calc(100% - 80px);
                  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #status:empty { display: none; }
        .row { display: flex; gap: 4px; padding: 0 4px; }
        .row > * { flex: 1; }
        button { height: 36px; font-size: 13px; touch-action: manipulation; padding: 0; }
        button.active { background: #0a84ff; color: #fff; border-color: #0a84ff; }
        textarea { display: block; width: 100%; height: 40px; font-size: 16px; box-sizing: border-box;
                   resize: none; border: none; border-top: 1px solid #ddd; padding: 8px; }
    </style>
</head>
<body>
    <div id="preview-wrap"><img id="preview" alt="Mac画面プレビュー"></div>
    <div id="zoom-indicator" class="badge">100%</div>
    <div id="status" class="badge"></div>
    <textarea id="input" placeholder="ここに入力（⌫はキーボードから）" autofocus></textarea>
    <div class="row">
        <button onclick="setZoom(zoom / 1.25)">−</button>
        <button onclick="setZoom(zoom * 1.25)">＋</button>
        <button onclick="sendEnter()">↵</button>
        <button id="clickBtn" onclick="toggleClickMode()">クリック</button>
        <button id="followBtn" onclick="toggleFollow()">追従</button>
        <button onclick="clearBuffer()">クリア</button>
    </div>

    <script>
        const input = document.getElementById('input');
        const status = document.getElementById('status');
        const preview = document.getElementById('preview');
        const clickBtn = document.getElementById('clickBtn');
        const followBtn = document.getElementById('followBtn');
        const previewWrap = document.getElementById('preview-wrap');
        const zoomIndicator = document.getElementById('zoom-indicator');
        let isComposing = false;
        let lastValue = '';
        let zoom = 1;
        let clickMode = false;
        let followMode = false;
        let followTimer = null;
        let macWidth = 0, macHeight = 0;
        let queue = Promise.resolve();

        function enqueue(fn) {
            queue = queue.then(fn).catch(e => { status.textContent = '送信失敗: ' + e.message; });
            return queue;
        }

        async function postJson(url, body) {
            const opts = {method: 'POST'};
            if (body !== undefined) {
                opts.headers = {'Content-Type': 'application/json'};
                opts.body = JSON.stringify(body);
            }
            const res = await fetch(url, opts);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res;
        }

        function setZoom(z) {
            zoom = Math.max(0.5, Math.min(z, 5));
            preview.style.width = (zoom * 100) + '%';
            zoomIndicator.textContent = Math.round(zoom * 100) + '%';
        }

        function postSend(text) {
            return enqueue(async () => {
                await postJson('/send', {text});
                status.textContent = '送信: ' + JSON.stringify(text);
            });
        }

        function postBackspace(count) {
            return enqueue(async () => {
                await postJson('/backspace', {count});
                status.textContent = '⌫ × ' + count;
            });
        }

        function syncDelta() {
            const cur = input.value;
            if (cur === lastValue) return;
            if (cur.length > lastValue.length && cur.startsWith(lastValue)) {
                postSend(cur.slice(lastValue.length));
            } else if (cur.length < lastValue.length && lastValue.startsWith(cur)) {
                postBackspace(lastValue.length - cur.length);
            } else {
                if (lastValue.length > 0) postBackspace(lastValue.length);
                if (cur.length > 0) postSend(cur);
            }
            lastValue = cur;
        }

        input.addEventListener('compositionstart', () => { isComposing = true; });
        input.addEventListener('compositionend', () => {
            isComposing = false;
            setTimeout(syncDelta, 0);
        });
        input.addEventListener('input', () => {
            if (isComposing) return;
            syncDelta();
        });

        function sendEnter() {
            enqueue(async () => {
                await postJson('/enter');
                status.textContent = 'Enter送信';
            });
        }

        function clearBuffer() {
            input.value = '';
            lastValue = '';
            status.textContent = 'バッファをクリア';
        }

        function toggleClickMode() {
            clickMode = !clickMode;
            clickBtn.classList.toggle('active', clickMode);
            preview.classList.toggle('click-mode', clickMode);
            status.textContent = 'クリック: ' + (clickMode ? 'ON' : 'OFF');
        }

        const FOLLOW_ZOOM = 2.5;

        function toggleFollow() {
            followMode = !followMode;
            followBtn.classList.toggle('active', followMode);
            status.textContent = '追従: ' + (followMode ? 'ON' : 'OFF');
            if (followMode) {
                if (zoom < FOLLOW_ZOOM) setZoom(FOLLOW_ZOOM);
                pollFocus();
                followTimer = setInterval(pollFocus, 800);
            } else if (followTimer) {
                clearInterval(followTimer);
                followTimer = null;
            }
        }

        async function pollFocus() {
            if (!macWidth) return;
            try {
                const res = await fetch('/focus');
                const {x, y} = await res.json();
                if (x == null || y == null) return;
                const imgX = (x / macWidth) * preview.clientWidth;
                const imgY = (y / macHeight) * preview.clientHeight;
                previewWrap.scrollTo({
                    left: imgX - previewWrap.clientWidth / 2,
                    top: imgY - previewWrap.clientHeight / 2,
                    behavior: 'smooth'
                });
            } catch (e) {
                // ignore transient errors
            }
        }

        preview.addEventListener('click', (e) => {
            if (!clickMode || !macWidth) return;
            const rect = preview.getBoundingClientRect();
            const rx = (e.clientX - rect.left) / rect.width;
            const ry = (e.clientY - rect.top) / rect.height;
            const x = Math.round(rx * macWidth);
            const y = Math.round(ry * macHeight);
            enqueue(async () => {
                await postJson('/click', {x, y});
                status.textContent = `クリック (${x}, ${y})`;
            });
        });

        let touchStartX = 0;
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
        }, {passive: true});
        document.addEventListener('touchmove', (e) => {
            const x = e.touches[0].clientX;
            const w = window.innerWidth;
            if ((touchStartX < 20 && x > touchStartX + 5) ||
                (touchStartX > w - 20 && x < touchStartX - 5)) {
                e.preventDefault();
            }
        }, {passive: false});

        function refreshPreview() {
            const next = new Image();
            next.onload = () => { preview.src = next.src; };
            next.src = '/screenshot?t=' + Date.now();
        }
        setInterval(refreshPreview, 1000);
        refreshPreview();

        (async () => {
            try {
                const res = await fetch('/size');
                const data = await res.json();
                macWidth = data.width;
                macHeight = data.height;
            } catch (e) {
                status.textContent = '画面サイズ取得失敗: ' + e.message;
            }
        })();
    </script>
</body>
</html>
